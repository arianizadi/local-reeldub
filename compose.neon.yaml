# Overlay for an existing installation whose operators separately provision the metadata schema.
services:
  api:
    environment:
      REELDUB_POSTGRES_DSN_FILE: /run/secrets/metadata
    secrets: [metadata]
  hosted-api:
    environment:
      REELDUB_POSTGRES_DSN_FILE: /run/secrets/metadata
      REELDUB_STORE_STORAGE_LIMIT_BYTES: ${REELDUB_STORE_STORAGE_LIMIT_BYTES:-1000000000}
      REELDUB_CREATOR_MINUTES: ${REELDUB_HOSTED_CREATOR_MINUTES:-0}
    secrets: [metadata]
  worker:
    profiles: [local-worker]
    environment:
      REELDUB_POSTGRES_DSN_FILE: /run/secrets/worker_metadata
    secrets: [worker_metadata]
secrets:
  metadata:
    file: ${REELDUB_API_DSN_FILE:?Provide a private PostgreSQL API connection file}
  worker_metadata:
    file: ${REELDUB_WORKER_DSN_FILE:?Provide a private PostgreSQL worker connection file}
