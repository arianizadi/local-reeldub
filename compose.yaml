name: reeldub
services:
  mongo:
    image: mongo:8.0.38
    environment:
      MONGO_INITDB_ROOT_USERNAME: bootstrap
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run ./start-local.sh first}
      REELDUB_WORKER_PASSWORD: ${MONGO_WORKER_PASSWORD:-}
      REELDUB_DB_PASSWORD: ${MONGO_PASSWORD:?Run ./start-local.sh first}
    volumes:
      - mongo-data:/data/db
      - ./server/configure-worker.sh:/opt/reeldub/configure-worker.sh:ro
      - ./server/worker-role.js:/opt/reeldub/worker-role.js:ro
      - ./server/init-mongo.js:/docker-entrypoint-initdb.d/01-reeldub.js:ro
    networks: [database]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped
  intake:
    build: {context: ., target: intake}
    environment:
      REELDUB_REEL_LINKS: ${REELDUB_REEL_LINKS:-1}
    networks: [intake, fetch]
    read_only: true
    tmpfs: ["/tmp:size=768m,mode=1777"]
    mem_limit: 1g
    pids_limit: 80
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
  api:
    build: {context: ., target: api}
    environment:
      MONGO_URI: ${REELDUB_MONGO_URI:-mongodb://reeldub:${MONGO_PASSWORD}@mongo:27017/reeldub}
      REELDUB_OUTPUT_PROFILE: ${REELDUB_OUTPUT_PROFILE:-light}
      REELDUB_KITTEN_NARRATOR: ${REELDUB_KITTEN_NARRATOR:-0}
      REELDUB_CREATOR_MINUTES: ${REELDUB_CREATOR_MINUTES:-1}
      REELDUB_REEL_LINKS: ${REELDUB_REEL_LINKS:-1}
      REELDUB_ACCESS_MODE: operator
      SELF_HOST_KEY: ${SELF_HOST_KEY}
      APPLE_CLIENT_ID: ""
      REELDUB_LAB_RUNTIMES: ${REELDUB_LAB_RUNTIMES:-}
      ADMIN_APPLE_SUB: ${ADMIN_APPLE_SUB:-}
    ports: ["127.0.0.1:${REELDUB_PORT:-8300}:8300"]
    networks: [database, web, intake]
    depends_on: {mongo: {condition: service_healthy}, intake: {condition: service_started}}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
  worker:
    build: {context: ., target: worker}
    environment:
      MONGO_URI: ${REELDUB_WORKER_MONGO_URI:-mongodb://worker:${MONGO_WORKER_PASSWORD:-}@mongo:27017/reeldub}
      WORKER_PROCESSES: ${WORKER_PROCESSES:-1}
      REELDUB_REEL_LINKS: ${REELDUB_REEL_LINKS:-1}
      REELDUB_MODEL: ${REELDUB_MODEL:-small}
    volumes: [model-cache:/home/reel/.cache]
    networks: [database, web]
    depends_on: {mongo: {condition: service_healthy}}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    restart: unless-stopped
networks:
  intake: {internal: true}
  fetch: {}
  database: {internal: true}
  web: {}
volumes:
  mongo-data: {}
  model-cache: {}
