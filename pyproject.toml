[project]
name = "local-reeldub"
version = "0.1.0"
description = "Dub a public video link or local video in the original speakers’ voices on your own GPU."
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "sherpa-onnx>=1.12,<3",
    "yt-dlp[default]>=2026.10.26",
    "deno>=2.3",
    "numpy>=1.26",
    "soundfile>=0.13",
]
