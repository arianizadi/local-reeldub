services:
  api:
    environment:
      REELDUB_KITTEN_MATCH: "1"
  worker:
    environment:
      REELDUB_KITTEN_MATCH_SPOOL: /run/reeldub-match
    volumes:
      - match-spool:/run/reeldub-match
    depends_on:
      kitten-match: {condition: service_healthy}
    command:
      - /bin/bash
      - -ec
      - |
        ./setup.sh --studio
        ./setup-lab.sh kitten-match
        exec python -m server.worker
  kitten-match:
    build: {context: ., target: worker}
    network_mode: none
    gpus: all
    environment:
      REELDUB_KITTEN_MATCH_SPOOL: /run/reeldub-match
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/cache
      VLLM_CACHE_ROOT: /tmp/vllm
    command: ["python", "deploy/fleet/match-runner.py", "--serve"]
    volumes:
      - kitten-env:/app/.kitten2:ro
      - match-spool:/run/reeldub-match
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/run/reeldub-match/heartbeat'); assert p.is_file() and -5 <= time.time()-p.stat().st_mtime <= 60"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs: [/tmp]
    shm_size: 1gb
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    restart: unless-stopped
volumes:
  match-spool: {}
