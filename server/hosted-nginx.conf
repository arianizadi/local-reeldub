worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_cf_connecting_ip $client_bucket {
        "" $binary_remote_addr;
        default $http_cf_connecting_ip;
    }
    limit_req_zone $client_bucket zone=signin:2m rate=12r/m;
    limit_req_zone $client_bucket zone=api:4m rate=12r/s;
    limit_req_status 429;
    limit_req_zone $client_bucket zone=payments:2m rate=20r/m;
    server {
        listen 8080 default_server;
        server_name _;
        return 403;
    }
    server {
        server_name ${REELDUB_PUBLIC_HOST};
        set $reeldub_api hosted-api:8300;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "private, no-store" always;
        listen 8080;
        client_max_body_size 64k;
        proxy_buffering off;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For "";
        # /live is the public process check. Database readiness is available on the private API.
        location = /health { return 404; }
        location = /v1/sources/upload {
            client_max_body_size 80m;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            limit_req zone=api burst=3 nodelay;
            proxy_pass http://$reeldub_api;
        }
        location = /v1/sources/reel {
            proxy_read_timeout 200s;
            limit_req zone=api burst=3 nodelay;
            proxy_pass http://$reeldub_api;
        }
        location ^~ /v1/apple/ {
            limit_req zone=signin burst=10 nodelay;
            proxy_pass http://$reeldub_api;
        }
        location = /v1/store/transactions {
            limit_req zone=payments burst=20 nodelay;
            proxy_pass http://$reeldub_api;
        }
        location / {
            limit_req zone=api burst=35 nodelay;
            proxy_pass http://$reeldub_api;
        }
    }
}
