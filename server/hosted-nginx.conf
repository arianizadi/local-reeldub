worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_cf_connecting_ip $client_bucket {
        "" $binary_remote_addr;
        default $http_cf_connecting_ip;
    }
    limit_req_zone $client_bucket zone=signin:2m rate=12r/m;
    limit_req_zone $client_bucket zone=api:4m rate=12r/s;
    limit_req_status 429;
    server {
        listen 8080;
        client_max_body_size 20k;
        proxy_buffering off;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For "";
        location ^~ /v1/apple/ {
            limit_req zone=signin burst=10 nodelay;
            proxy_pass http://hosted-api:8300;
        }
        location / {
            limit_req zone=api burst=35 nodelay;
            proxy_pass http://hosted-api:8300;
        }
    }
}
