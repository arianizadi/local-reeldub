<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ReelDub share test</title>
  </head>
  <body>
    <button type="button" style="font-size: 24px; padding: 12px">Share fixture video</button>
    <script>
      const button = document.querySelector("button");
      button.disabled = true;
      fetch("clip.mp4").then(response => response.blob()).then(blob => {
        const file = new File([blob], "ReelDub fixture.mp4", { type: "video/mp4" });
        button.disabled = false;
        button.addEventListener("click", () => navigator.share({ files: [file] }));
      });
    </script>
  </body>
</html>
