worker_processes 1;
pid FLEET_TMP/nginx.pid;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path FLEET_TMP/client;
    proxy_temp_path FLEET_TMP/proxy;
    fastcgi_temp_path FLEET_TMP/fastcgi;
    uwsgi_temp_path FLEET_TMP/uwsgi;
    scgi_temp_path FLEET_TMP/scgi;
    map $ssl_client_s_dn $cert_node {
        default "";
        "~^CN=(?<node_id>[a-z0-9][a-z0-9-]{0,48})$" $node_id;
    }
    server {
        listen FLEET_ADDR:8343 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate FLEET_CONFIG/fleet-tls.pem;
        ssl_certificate_key FLEET_CONFIG/fleet-tls.key;
        ssl_client_certificate FLEET_CONFIG/fleet-ca.pem;
        ssl_verify_client on;
        if ($cert_node = "") { return 403; }
        if ($cert_node != $http_x_reeldub_node) { return 403; }
        client_max_body_size 64k;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 350s;
        proxy_send_timeout 120s;
        location ~ ^/v1/jobs/[a-zA-Z0-9-]+/result$ {
            client_max_body_size 501m;
            proxy_pass http://127.0.0.1:8344;
        }
        location / { proxy_pass http://127.0.0.1:8344; }
    }
}
