services:
  api:
    environment: {REELDUB_OUTPUT_PROFILE: studio}
  worker:
    gpus: all
    environment:
      REELDUB_KITTEN_NARRATOR: ${REELDUB_KITTEN_NARRATOR:-0}
      REELDUB_GPU_SCHEDULER: "1"
      REELDUB_GPU_PIPELINE_SLOTS: ${REELDUB_GPU_PIPELINE_SLOTS:-2}
      REELDUB_TTS_BATCH_SIZE: ${REELDUB_TTS_BATCH_SIZE:-1}
      WORKER_PROCESSES: ${WORKER_PROCESSES:-2}
    command:
      - /bin/bash
      - -ec
      - |
        ./setup.sh --studio
        if [[ "$${REELDUB_KITTEN_NARRATOR}" == 1 ]]; then
          ./setup-lab.sh kitten2
        fi
        exec python -m server.worker
    volumes:
      - studio-env:/app/.qwen-venv
      - kitten-env:/app/.kitten2
volumes:
  studio-env: {}
  kitten-env: {}
