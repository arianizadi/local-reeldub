name: ReelDub
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ReelDub:
    type: application
    platform: iOS
    sources: [ReelDub, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arianizadi.reeldub
        INFOPLIST_FILE: Config/App.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ReelDubShare
  ReelDubShare:
    type: app-extension
    platform: iOS
    sources: [ReelDubShare, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arianizadi.reeldub.share
        INFOPLIST_FILE: Config/Share.plist
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  ReelDubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ReelDubUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arianizadi.reeldub.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ReelDub
    dependencies:
      - target: ReelDub
schemes:
  ReelDub:
    build:
      targets:
        ReelDub: all

    test:
      targets: [ReelDubUITests]
