services:
  hosted-api:
    extends:
      service: api
      file: compose.yaml
    ports: !reset []
    environment:
      REELDUB_ACCESS_MODE: hosted
      SELF_HOST_KEY: ""
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-com.arianizadi.reeldub}
      ADMIN_APPLE_EMAIL: ${ADMIN_APPLE_EMAIL:-}
      TRUST_TUNNEL_IP: "1"
      STORE_ENVIRONMENT: ${REELDUB_STORE_ENVIRONMENT:-}
      APPLE_SIGNIN_CLIENT_SECRET_FILE: ${APPLE_SIGNIN_CLIENT_SECRET_FILE:-}
      STORE_KEY_ID: ${STORE_KEY_ID:-}
      STORE_ISSUER_ID: ${STORE_ISSUER_ID:-}
      STORE_KEY_PATH: ${STORE_KEY_PATH:-}
      STORE_APP_ID: "6836516034"
    networks: [database, hosted, web, intake]
  ingress:
    image: nginxinc/nginx-unprivileged:stable-alpine
    environment:
      REELDUB_PUBLIC_HOST: ${REELDUB_PUBLIC_HOST:-reeldub.arianizadi.com}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$${REELDUB_PUBLIC_HOST}" in ""|*[!A-Za-z0-9.-]*) exit 2;; esac
        envsubst '$${REELDUB_PUBLIC_HOST}' </etc/reeldub-nginx.conf >/tmp/reeldub-nginx.conf
        exec nginx -c /tmp/reeldub-nginx.conf -g 'daemon off;'
    volumes:
      - ./server/hosted-nginx.conf:/etc/reeldub-nginx.conf:ro
    ports: ["127.0.0.1:${REELDUB_HOSTED_PORT:-8301}:8080"]
    networks: [hosted]
    depends_on: [hosted-api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
networks:
  hosted: {internal: false}
