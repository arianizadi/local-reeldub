services:
  hosted-api:
    extends:
      service: api
      file: compose.yaml
    ports: !reset []
    environment:
      SELF_HOST_KEY: ""
      ADMIN_APPLE_EMAIL: ${ADMIN_APPLE_EMAIL:-}
      TRUST_TUNNEL_IP: "1"
    networks: [database, hosted, web]
  ingress:
    image: nginxinc/nginx-unprivileged:stable-alpine
    volumes:
      - ./server/hosted-nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["127.0.0.1:${REELDUB_HOSTED_PORT:-8301}:8080"]
    networks: [hosted]
    depends_on: [hosted-api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
networks:
  hosted: {internal: false}
